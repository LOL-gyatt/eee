name: Deploy Review/Production Site to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install All Dependencies
        run: npm install && cd artifacts/blockbound-collector && npm install

      - name: Compile Application Production Build
        env:
          PORT: 3000
          BASE_PATH: /Minecraft-Collector-Checklist/
          NODE_ENV: production
        run: cd artifacts/blockbound-collector && npm run build

      - name: Setup GitHub Pages Infrastructure
        uses: actions/configure-pages@v4

      - name: Upload Static Assets Folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'artifacts/blockbound-collector/dist/public'

      - name: Deploy Live Package to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

